[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subjob"
version = "0.1.0"
description = "Pilot-job scheduler for HPC: one allocation, many tasks, shared filesystem broker."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sean Florez" }]
dependencies = []  # runtime is stdlib only — see docs/ARCHITECTURE.md

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
subjob = "subjob.client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines handled case-by-case

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
